name: CI

# A pull request is tested whatever it targets, and deliberately has no branch
# filter. `main` is the one long-lived branch now, so `push` names it; but a filter
# here would mean a pull request into any other branch ran no ruff, no mypy and no
# pytest while still reporting green.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, because an advisory is published against a lockfile that has not
  # changed, and no pull-request-or-push trigger fires for that.
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lint and types, once rather than per Python: both read the source, and
  # neither answer changes with the interpreter running them (qso-graph-devel#66).
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11.18"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Patch versions, not minor ones. Asked for "3.12", uv takes whatever
        # copy the runner already has -- Ubuntu 24.04's 3.12.3, twelve patches
        # behind -- and nothing says so. These are the releases that reject the
        # compromised eMudhra intermediate CAs (2026-10).
        python-version: ["3.11.18", "3.12.16", "3.13.18"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Unit tests
        run: uv run pytest tests --ignore=tests/test_security.py -v

      - name: Security tests
        run: uv run pytest tests/test_security.py -v

  # Audits the LOCKED environment, which is a different question from the one the
  # release gate asks. publish.yml runs `pip-audit --strict --desc on .` -- the
  # project's *declared* dependencies, resolved fresh -- which protects the people
  # who `pip install` this package and cannot see uv.lock at all.
  #
  # This job syncs `--frozen` and audits what that produced, so a stale lock cannot
  # sit unnoticed. On 2026-10-25 five MCP servers carried a CRITICAL certifi
  # advisory in their lockfiles that Dependabot never opened a pull request for.
  audit:
    name: audit (locked dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.16"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: No known vulnerability in the locked dependencies
        # No --strict, deliberately. --strict fails on any distribution it
        # could not audit, and `uv sync` installs the project itself -- so the
        # moment a release bumps the version to one not yet on PyPI, pip-audit
        # cannot look the project up and --strict turns that into a failure.
        # It blocked every version bump in all 23 repositories, which is how it
        # was found: the first real release, dxe-mcp 0.0.3, went red on it with
        #   "dxe-mcp: Dependency not found on PyPI and could not be audited"
        # while the lockfile was perfectly clean.
        #
        # Without --strict, pip-audit still exits 1 when it FINDS a
        # vulnerability, which is the whole job. An unauditable local project is
        # reported as skipped, with its reason, and does not fail the run.
        #
        # Verified in both directions against a lock holding certifi 2026.7.22
        # with the version bumped past PyPI: it reports PYSEC-2026-4320 and
        # exits 1; with the lock current it reports no vulnerabilities, names the
        # project as skipped, and exits 0.
        run: uv run --with pip-audit pip-audit

  ci-all-green:
    name: ci-all-green
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs all succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "FAIL: ruff or mypy did not pass (result=${{ needs.lint.result }})"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAIL: test matrix did not all succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          if [[ "${{ needs.audit.result }}" != "success" ]]; then
            echo "FAIL: the locked dependencies have a known vulnerability (result=${{ needs.audit.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
