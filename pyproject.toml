[project]
name = "qso-graph-sim"
version = "0.1.0"
description = "Replays what ham radio programs send on the network (WSJT-X first), for testing without a radio"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [{name = "KI7MT", email = "maintainers@qso-graph.io"}]
readme = "README.md"
keywords = [
    "amateur-radio", "ham-radio", "wsjt-x", "ft8", "udp", "simulator", "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# None: the standard library only (socket, struct, argparse).
dependencies = []

[project.scripts]
qso-graph-sim = "qso_graph_sim.cli:main"

[project.urls]
Homepage = "https://qso-graph.io"
Repository = "https://github.com/qso-graph/qso-graph-sim"
Issues = "https://github.com/qso-graph/qso-graph-sim/issues"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it is adif-mcp's width — these repos were not written to
# it. On cq-zones-mcp it reported 39 lines and not one of them was a defect, so
# it is deferred to a pass of its own rather than reflowing several hundred
# lines of prose across sixteen repos (qso-graph-devel#70).
#
# Six of those 39 will not be reflowed at all, whenever that pass happens.
# They are long because they name a publisher's field exactly —
# `pas["Adif"]["Enumerations"]["Primary_Administrative_Subdivision"]["Records"]`
# — and this project's rule is that the owner of a list is its authority, so we
# use ADIF's names and not shorter ones of our own. There the length is the
# correctness.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
